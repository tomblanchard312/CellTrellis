name: Nanshe language integration
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  vba:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet build vba/NansheVba.sln -m:1
      - run: dotnet run --project vba/tests/Nanshe.Vba.Tests --no-build
  windows-scribe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install stable --profile minimal --component clippy
      - run: cargo +stable test -p gridcraft-enki --all-targets
      - run: cargo +stable clippy -p gridcraft-enki --all-targets -- -D warnings
  runtime-bridge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libxkbcommon-dev libwayland-dev libx11-dev libxcursor-dev libxrandr-dev libxi-dev libgtk-3-dev libfontconfig1-dev libfreetype-dev mesa-vulkan-drivers r-base-core r-cran-jsonlite
      - run: rustup toolchain install stable --profile minimal
      - run: dotnet build vba/src/Nanshe.Vba -c Release -m:1 -o "$RUNNER_TEMP/nanshe-vba"
      - run: |
          export NANSHE_VBA_TEST_RUNNER="$RUNNER_TEMP/nanshe-vba/Nanshe.Vba"
          NANSHE_PYTHON="$(command -v python)"
          NANSHE_RSCRIPT="$(command -v Rscript)"
          export NANSHE_PYTHON NANSHE_RSCRIPT
          cargo +stable test -p gridcraft-ui-egui developer --lib
          cargo +stable test -p gridcraft-engine cmd::developer --lib
          cargo +stable test -p gridcraft-enki
