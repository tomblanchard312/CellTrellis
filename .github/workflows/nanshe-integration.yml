name: CellTrellis language integration
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  vba:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet build vba/NansheVba.sln -m:1
      - run: dotnet run --project vba/tests/Nanshe.Vba.Tests --no-build
  windows-scribe:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install stable --profile minimal --component clippy
      - run: cargo +stable test -p nanshe-enki --all-targets
      - run: cargo +stable clippy -p nanshe-enki --all-targets -- -D warnings
  windows-app:
    runs-on: windows-latest
    timeout-minutes: 40
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_PROFILE_DEV_DEBUG: 0
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install stable --profile minimal
      - run: cargo +stable build -p nanshe -p nanshe-cli
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: python packaging/stage-runtimes.py --rid win-x64 --out target/debug/runtimes
      - name: Test the self-contained VBA helper
        shell: pwsh
        run: |
          $request = @{source="Sub Main()`nDebug.Print 42`nEnd Sub";macro='Main'} | ConvertTo-Json -Compress
          $frames = @($request | & target/debug/runtimes/vba/Nanshe.Vba.exe bridge | ForEach-Object { $_ | ConvertFrom-Json })
          if ($LASTEXITCODE -ne 0 -or 'done' -notin $frames.type) { throw 'Packaged VBA helper failed' }
      - run: Copy-Item NOTICE,ATTRIBUTION.md target/debug
      - uses: actions/upload-artifact@v4
        with:
          name: celltrellis-vba-runtime-windows-x64
          path: |
            target/debug/runtimes/vba/**
            target/debug/NOTICE
            target/debug/ATTRIBUTION.md
          if-no-files-found: error
  runtime-bridge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libasound2-dev libxkbcommon-dev libwayland-dev libx11-dev libxcursor-dev libxrandr-dev libxi-dev libgtk-3-dev libfontconfig1-dev libfreetype-dev mesa-vulkan-drivers r-base-core r-cran-jsonlite
      - run: rustup toolchain install stable --profile minimal
      - run: python3 packaging/stage-runtimes.py --rid linux-x64 --out "$RUNNER_TEMP/nanshe-runtime" --scripts system --check-system
      - run: |
          export NANSHE_VBA_TEST_RUNNER="$RUNNER_TEMP/nanshe-runtime/vba/Nanshe.Vba"
          NANSHE_PYTHON="$(command -v python)"
          NANSHE_RSCRIPT="$(command -v Rscript)"
          export NANSHE_PYTHON NANSHE_RSCRIPT
          cargo +stable test -p nanshe-ui-egui developer --lib
          cargo +stable test -p nanshe-engine cmd::developer --lib
          cargo +stable test -p nanshe-enki
