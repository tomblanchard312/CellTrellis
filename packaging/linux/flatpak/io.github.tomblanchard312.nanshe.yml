# Flatpak manifest for Nanshe, ready for a Flathub submission.
#
# Flatpak builds run offline, so the crate sources must be vendored first. From the repo root:
#
#   curl -fsSLO https://raw.githubusercontent.com/flatpak/flatpak-builder-tools/master/cargo/flatpak-cargo-generator.py
#   python3 flatpak-cargo-generator.py Cargo.lock -o packaging/linux/flatpak/cargo-sources.json
#   flatpak-builder --user --install --force-clean build-flatpak packaging/linux/flatpak/io.github.tomblanchard312.nanshe.yml
#   flatpak run io.github.tomblanchard312.nanshe
#
# For Flathub, replace the `dir` source with a `git` source pinned to a release tag and commit.
# The single-file .flatpak attached to each release comes from io.github.tomblanchard312.nanshe.bundle.yml,
# which repackages the prebuilt release binaries. Keep runtime-version and finish-args identical.
id: io.github.tomblanchard312.nanshe
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: nanshe
finish-args:
  # Display: Wayland first; X11 only when no Wayland compositor is running.
  - --socket=wayland
  - --socket=fallback-x11
  # X11 shared memory (MIT-SHM). Without it the X11 fallback is slow or fails.
  - --share=ipc
  # Network access for update checks against GitHub.
  - --share=network
  # GPU access for rendering.
  - --device=dri
  # Open/Save dialogs use the file-chooser portal (rfd), and drag-and-drop uses the document
  # portal, so broad filesystem access isn't needed. Documents and Downloads are granted for
  # opening workbooks by path from the command line.
  - --filesystem=xdg-documents
  - --filesystem=xdg-download
  # Network: update checks reach GitHub. Home/host filesystem access is deliberately not granted.
build-options:
  append-path: /usr/lib/sdk/rust-stable/bin
modules:
  - name: nanshe
    buildsystem: simple
    build-options:
      env:
        CARGO_HOME: /run/build/nanshe/cargo
        CARGO_NET_OFFLINE: 'true'
    build-commands:
      - cargo --offline build --release --locked -p nanshe -p nanshe-cli
      - install -Dm755 target/release/nanshe /app/bin/nanshe
      - install -Dm755 target/release/nanshe-cli /app/bin/nanshe-cli
      - install -Dm644 packaging/linux/io.github.tomblanchard312.nanshe.desktop /app/share/applications/io.github.tomblanchard312.nanshe.desktop
      - install -Dm644 packaging/linux/io.github.tomblanchard312.nanshe.mime.xml /app/share/mime/packages/io.github.tomblanchard312.nanshe.xml
      - mkdir -p /app/share/icons && cp -R assets/app-icon/hicolor /app/share/icons/
      - install -Dm644 NOTICE /app/share/doc/nanshe/NOTICE
      - install -Dm644 ATTRIBUTION.md /app/share/doc/nanshe/ATTRIBUTION.md
      - >-
        version=$(awk '/^\[/{p=($0=="[workspace.package]");next} p&&$1=="version"{gsub(/[" ]/,"",$3);print $3;exit}' Cargo.toml);
        install -d /app/share/metainfo;
        sed -e "s/@VERSION@/$version/" -e "s/@DATE@/$(date -u +%Y-%m-%d)/"
        packaging/linux/io.github.tomblanchard312.nanshe.metainfo.xml.in > /app/share/metainfo/io.github.tomblanchard312.nanshe.metainfo.xml
    sources:
      - type: dir
        path: ../../..
        skip:
          - target
          - target-xtask
          - dist
          - corpus
          - build-flatpak
          - .flatpak-builder
      - cargo-sources.json
