# Flatpak manifest for the single-file bundle attached to every GitHub release
# (nanshe-<version>-linux-<arch>.flatpak). Build it with packaging/linux/flatpak-bundle.sh.
#
# It repackages the release's own Linux tarball (nanshe-<version>-linux-<arch>.tar.gz,
# built on Ubuntu 22.04 by package.sh) instead of compiling Rust inside flatpak-builder: no
# network and no vendored crate sources during the build, a few seconds instead of 20+ minutes,
# and byte-for-byte the same binaries as the AppImage/deb/rpm. The script unpacks the tarball
# into `stage/` next to a copy of this file. The binaries need glibc >= 2.35 and load X11,
# Wayland, xkbcommon and Vulkan/GL at runtime; the freedesktop runtime has all of them, and the
# GPU driver comes from its org.freedesktop.Platform.GL extension.
#
# io.github.tomblanchard312.nanshe.yml (same directory) is the from-source manifest for Flathub. Keep
# runtime, runtime-version, sdk and finish-args identical in both (packaging-lint checks this).
id: io.github.tomblanchard312.nanshe
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
command: nanshe
finish-args:
  - --filesystem=xdg-run/sharedai
  - --socket=pulseaudio
  # Display: Wayland first; X11 only when no Wayland compositor is running.
  - --socket=wayland
  - --socket=fallback-x11
  # X11 shared memory (MIT-SHM). Without it the X11 fallback is slow or fails.
  - --share=ipc
  # Network access for update checks against GitHub.
  - --share=network
  # GPU access for rendering.
  - --device=dri
  # Open/Save dialogs use the file-chooser portal (rfd), and drag-and-drop uses the document
  # portal, so broad filesystem access isn't needed. Documents and Downloads are granted for
  # opening workbooks by path from the command line.
  - --filesystem=xdg-documents
  - --filesystem=xdg-download
  # Network: update checks reach GitHub. Home/host filesystem access is deliberately not granted.
modules:
  - name: nanshe
    buildsystem: simple
    build-commands:
      - test -f lib/nanshe/runtimes/manifest.json
      - test -x lib/nanshe/runtimes/python/python
      - test -x lib/nanshe/runtimes/R/bin/Rscript
      - test -f lib/nanshe/runtimes/R/library/jsonlite/DESCRIPTION || test -f lib/nanshe/runtimes/R/site-library/jsonlite/DESCRIPTION
      - mkdir -p /app/lib && cp -R lib/nanshe /app/lib/
      - install -Dm755 bin/nanshe /app/bin/nanshe
      # Headless CLI and MCP server: `flatpak run --command=nanshe-cli io.github.tomblanchard312.nanshe`.
      - install -Dm755 bin/nanshe-cli /app/bin/nanshe-cli
      - install -Dm644 share/applications/io.github.tomblanchard312.nanshe.desktop /app/share/applications/io.github.tomblanchard312.nanshe.desktop
      - install -Dm644 share/mime/packages/io.github.tomblanchard312.nanshe.xml /app/share/mime/packages/io.github.tomblanchard312.nanshe.xml
      # Already has the release's version and date substituted by package.sh.
      - install -Dm644 share/metainfo/io.github.tomblanchard312.nanshe.metainfo.xml /app/share/metainfo/io.github.tomblanchard312.nanshe.metainfo.xml
      - mkdir -p /app/share/icons /app/share/doc && cp -R share/icons/hicolor /app/share/icons/ && cp -R share/doc/nanshe /app/share/doc/
      - mkdir -p /app/lib/celltrellis && cp -R lib/celltrellis/enki /app/lib/celltrellis/enki
    sources:
      - type: dir
        path: stage
