[package]
name = "nanshe-xlsx"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "CellTrellis file formats: XLSX (SpreadsheetML) and CSV import/export"

[lints]
workspace = true

[features]
# Builds password-encrypted workbooks in code for other crates' tests (a dev-dependency feature;
# never enabled in a shipped build).
test-support = []

[dependencies]
nanshe-core = { workspace = true }
nanshe-formula = { workspace = true }
nanshe-model = { workspace = true }
thiserror = { workspace = true }
quick-xml = { workspace = true }
zip = { workspace = true }
aes = { workspace = true }
sha1 = { workspace = true }
sha2 = { workspace = true }

[dev-dependencies]
# Every registered function name, for the formula file-spelling test.
nanshe-functions = { workspace = true }
